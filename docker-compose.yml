version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindvault-db
    environment:
      POSTGRES_USER: mindvault
      POSTGRES_PASSWORD: mindvault
      POSTGRES_DB: mindvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mindvault" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindvault-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://***REMOVED***@postgres:5432/mindvault
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindvault-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - PROXY_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
